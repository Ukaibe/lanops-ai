services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LANOPS_OLLAMA_URL: http://ollama:11434
      LANOPS_OLLAMA_FAILOVER_URL: http://host.docker.internal:11434
      LANOPS_RAG_PATH: /data/rag.json
      LANOPS_SYSLOG_PATH: /data/syslog.log
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
      - "1514:1514/udp"
    volumes:
      - lanops-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-init:
    image: ollama/ollama:0.12.3
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  lanops-data:
  ollama-data:
